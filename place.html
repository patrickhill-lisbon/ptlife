<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Place | PTLife</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .place-page {
      width: min(1100px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    .place-header {
      margin-bottom: 2rem;
    }

    .place-type {
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #176c46;
      margin-bottom: 0.5rem;
    }

    .place-header h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.7rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .place-location {
      margin-top: 0.75rem;
      font-size: 1.05rem;
      color: #626962;
      font-weight: 650;
    }

    .place-description {
      margin-top: 1rem;
      max-width: 760px;
      font-size: 1.08rem;
      color: #555d57;
    }

    .today-status {
      margin: 2rem 0;
      padding: 1.2rem 1.3rem;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #dfe2dc;
    }

    .today-status.open {
      border-left: 6px solid #176c46;
    }

    .today-status.closed {
      border-left: 6px solid #9b2f2f;
    }

    .today-status.special {
      border-left: 6px solid #b38400;
    }

    .today-status strong {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 0.25rem;
    }

    .place-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .place-card {
      min-width: 0;
      background: #fff;
      border: 1px solid #dfe2dc;
      border-radius: 14px;
      padding: 1.3rem;
    }

    .place-card h2 {
      margin: 0 0 1rem;
      font-size: 1.45rem;
    }

    .place-card h3 {
      margin: 1.25rem 0 0.6rem;
      font-size: 1.05rem;
    }

    .hours-row,
    .price-row,
    .exception-row,
    .future-price-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid #eceeea;
    }

    .hours-row:last-child,
    .price-row:last-child,
    .exception-row:last-child,
    .future-price-row:last-child {
      border-bottom: 0;
    }

    .row-label {
      min-width: 0;
    }

    .row-value {
      flex: 0 0 auto;
      font-weight: 700;
      text-align: right;
    }

    .free {
      color: #176c46;
    }

    .special-admission {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 10px;
      background: #fff6d8;
    }

    .special-admission strong {
      display: block;
      margin-bottom: 0.3rem;
    }

    .future-prices {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 10px;
      background: #f2f4f1;
    }

    .future-prices > strong {
      display: block;
      margin-bottom: 0.5rem;
    }

    .official-link {
      display: inline-block;
      margin-top: 1rem;
      font-weight: 700;
    }

    .membership-placeholder {
      color: #69706b;
      font-style: italic;
    }

    .error-message {
      padding: 3rem 1rem;
      text-align: center;
    }

    @media (max-width: 700px) {
      .place-page {
        width: calc(
          100% -
          max(
            2rem,
            env(safe-area-inset-left) +
            env(safe-area-inset-right)
          )
        );
        padding-top: 1.25rem;
      }

      .place-grid {
        grid-template-columns: 1fr;
      }

      .hours-row,
      .price-row,
      .exception-row,
      .future-price-row {
        width: 100%;
        flex-wrap: wrap;
      }

      .row-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <main class="place-page">

    <div id="loading">
      Loading…
    </div>

    <div id="place-content" hidden>

      <header class="place-header">

        <div
          id="place-type"
          class="place-type"
        ></div>

        <h1 id="place-name"></h1>

        <div
          id="place-location"
          class="place-location"
        ></div>

        <p
          id="place-description"
          class="place-description"
        ></p>

      </header>

      <div
        id="today-status"
        class="today-status"
      ></div>

      <div class="place-grid">

        <section class="place-card">
          <h2>Opening hours</h2>
          <div id="opening-hours"></div>
        </section>

        <section class="place-card">
          <h2>Admission</h2>

          <div id="current-admission"></div>

          <div
            id="special-admission"
            hidden
          ></div>

          <div
            id="future-prices"
            hidden
          ></div>
        </section>

        <section class="place-card">
          <h2>Special hours & closures</h2>
          <div id="exceptions"></div>
        </section>

        <section class="place-card">
          <h2>Visit</h2>

          <div id="address"></div>

          <a
            id="official-website"
            class="official-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            Official website
          </a>
        </section>

        <section
          class="place-card"
          id="membership-section"
        >
          <h2>Memberships</h2>

          <p class="membership-placeholder">
            Membership information will appear here when available.
          </p>
        </section>

      </div>

    </div>

    <div
      id="error"
      class="error-message"
      hidden
    >
      We couldn't find this place.
    </div>

  </main>

<script>

const params =
  new URLSearchParams(window.location.search);

const slug =
  params.get("slug") || "maat-lisbon";


const dayNames = [
  "Sunday",
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
];


function lisbonDateParts() {

  const formatter =
    new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Lisbon",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      weekday: "short",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    });

  const parts =
    Object.fromEntries(
      formatter
        .formatToParts(new Date())
        .filter(part => part.type !== "literal")
        .map(part => [part.type, part.value])
    );

  const date =
    `${parts.year}-${parts.month}-${parts.day}`;

  const time =
    `${parts.hour}:${parts.minute}`;

  const weekdayMap = {
    Sun: 0,
    Mon: 1,
    Tue: 2,
    Wed: 3,
    Thu: 4,
    Fri: 5,
    Sat: 6
  };

  return {
    date,
    time,
    dayOfWeek: weekdayMap[parts.weekday]
  };
}


function formatMoney(rule) {

  if (
    rule.pricing_type === "free" ||
    rule.price_eur === 0
  ) {
    return "Free";
  }

  if (rule.price_eur == null) {
    return "See details";
  }

  return new Intl.NumberFormat("en-IE", {
    style: "currency",
    currency: rule.currency || "EUR"
  }).format(rule.price_eur);
}


function dateWithinRule(rule, date) {

  if (
    rule.valid_from &&
    date < rule.valid_from
  ) {
    return false;
  }

  if (
    rule.valid_until &&
    date > rule.valid_until
  ) {
    return false;
  }

  return true;
}


function hasTimeRestrictions(rule) {
  return Array.isArray(rule.time_rules)
    && rule.time_rules.length > 0;
}


function formatDisplayDate(dateString) {

  return new Date(
    `${dateString}T12:00:00`
  ).toLocaleDateString(
    "en-GB",
    {
      day: "numeric",
      month: "short",
      year: "numeric"
    }
  );
}


function getExceptionForToday(
  exceptions,
  today
) {
  return exceptions.find(
    item =>
      item.exception_date === today.date
  );
}


function renderTodayStatus(
  data,
  today
) {

  const box =
    document.getElementById("today-status");

  const exception =
    getExceptionForToday(
      data.schedule_exceptions,
      today
    );

  if (exception) {

    if (
      exception.exception_type === "closed"
    ) {
      box.className =
        "today-status closed";

      const strong =
        document.createElement("strong");

      strong.textContent =
        "Closed today";

      box.appendChild(strong);

      if (exception.note_english) {
        const detail =
          document.createElement("div");

        detail.textContent =
          exception.note_english;

        box.appendChild(detail);
      }

      return;
    }

    if (
      exception.exception_type ===
      "special_hours"
    ) {
      box.className =
        "today-status special";

      const strong =
        document.createElement("strong");

      if (
        today.time >= exception.opens_at &&
        today.time < exception.closes_at
      ) {
        strong.textContent =
          `Open today · closes ${exception.closes_at}`;
      } else {
        strong.textContent =
          `Special hours today · ${exception.opens_at}–${exception.closes_at}`;
      }

      box.appendChild(strong);

      if (exception.note_english) {
        const detail =
          document.createElement("div");

        detail.textContent =
          exception.note_english;

        box.appendChild(detail);
      }

      return;
    }
  }


  const normal =
    data.opening_hours.find(
      item =>
        item.day_of_week ===
        today.dayOfWeek
    );

  if (
    !normal ||
    normal.is_closed
  ) {
    box.className =
      "today-status closed";

    const strong =
      document.createElement("strong");

    strong.textContent =
      "Closed today";

    box.appendChild(strong);

    return;
  }


  if (
    today.time >= normal.opens_at &&
    today.time < normal.closes_at
  ) {
    box.className =
      "today-status open";

    const strong =
      document.createElement("strong");

    strong.textContent =
      `Open now · closes ${normal.closes_at}`;

    box.appendChild(strong);

  } else {

    box.className =
      "today-status closed";

    const strong =
      document.createElement("strong");

    if (today.time < normal.opens_at) {
      strong.textContent =
        `Closed now · opens today at ${normal.opens_at}`;
    } else {
      strong.textContent =
        `Closed now · closed at ${normal.closes_at}`;
    }

    box.appendChild(strong);
  }
}


function renderHours(data) {

  const container =
    document.getElementById(
      "opening-hours"
    );

  data.opening_hours.forEach(hours => {

    const row =
      document.createElement("div");

    row.className = "hours-row";

    const label =
      document.createElement("span");

    label.className = "row-label";

    label.textContent =
      dayNames[hours.day_of_week];

    const value =
      document.createElement("span");

    value.className = "row-value";

    value.textContent =
      hours.is_closed
        ? "Closed"
        : `${hours.opens_at}–${hours.closes_at}`;

    row.append(label, value);

    container.appendChild(row);
  });
}


function renderAdmission(
  data,
  today
) {

  const currentContainer =
    document.getElementById(
      "current-admission"
    );

  const specialContainer =
    document.getElementById(
      "special-admission"
    );

  const futureContainer =
    document.getElementById(
      "future-prices"
    );


  const currentRules =
    data.admission.filter(
      rule =>
        dateWithinRule(
          rule,
          today.date
        ) &&
        !hasTimeRestrictions(rule)
    );


  const specialRules =
    data.admission.filter(
      rule =>
        hasTimeRestrictions(rule)
    );


  const futureRules =
    data.admission.filter(
      rule =>
        rule.valid_from &&
        rule.valid_from > today.date &&
        !hasTimeRestrictions(rule)
    );


  currentRules.forEach(rule => {

    const row =
      document.createElement("div");

    row.className = "price-row";

    const label =
      document.createElement("span");

    label.className = "row-label";

    label.textContent =
      rule.rule_name_english;

    const value =
      document.createElement("span");

    value.className =
      "row-value";

    value.textContent =
      formatMoney(rule);

    if (rule.price_eur === 0) {
      value.classList.add("free");
    }

    row.append(label, value);

    currentContainer.appendChild(row);
  });


  if (specialRules.length) {

    specialContainer.hidden = false;

    specialContainer.className =
      "special-admission";

    const heading =
      document.createElement("strong");

    heading.textContent =
      "Special admission";

    specialContainer.appendChild(
      heading
    );


    specialRules.forEach(rule => {

      const item =
        document.createElement("div");

      item.style.marginTop = "0.7rem";

      const title =
        document.createElement("div");

      title.textContent =
        `${rule.rule_name_english}: ${formatMoney(rule)}`;

      title.style.fontWeight = "700";

      item.appendChild(title);


      rule.time_rules.forEach(
        timeRule => {

          const note =
            document.createElement("div");

          note.textContent =
            timeRule.notes_english || "";

          item.appendChild(note);
        }
      );

      specialContainer.appendChild(item);
    });
  }


  if (futureRules.length) {

    futureContainer.hidden = false;

    futureContainer.className =
      "future-prices";

    const heading =
      document.createElement("strong");

    const earliestDate =
      futureRules
        .map(rule => rule.valid_from)
        .sort()[0];

    heading.textContent =
      `Upcoming prices from ${formatDisplayDate(earliestDate)}`;

    futureContainer.appendChild(
      heading
    );


    futureRules.forEach(rule => {

      const row =
        document.createElement("div");

      row.className =
        "future-price-row";

      const label =
        document.createElement("span");

      label.className =
        "row-label";

      label.textContent =
        rule.rule_name_english;

      const value =
        document.createElement("span");

      value.className =
        "row-value";

      value.textContent =
        formatMoney(rule);

      row.append(label, value);

      futureContainer.appendChild(row);
    });
  }
}


function renderExceptions(data) {

  const container =
    document.getElementById(
      "exceptions"
    );

  data.schedule_exceptions.forEach(
    exception => {

      const row =
        document.createElement("div");

      row.className =
        "exception-row";

      const date =
        document.createElement("span");

      date.className =
        "row-label";

      date.textContent =
        formatDisplayDate(
          exception.exception_date
        );

      const note =
        document.createElement("span");

      note.className =
        "row-value";

      note.textContent =
        exception.note_english ||
        exception.exception_type;

      row.append(date, note);

      container.appendChild(row);
    }
  );
}


async function loadPlace() {

  try {

    const response =
      await fetch(
        `/api/place/${encodeURIComponent(slug)}`
      );

    if (!response.ok) {
      throw new Error(
        "Place not found"
      );
    }

    const data =
      await response.json();

    const today =
      lisbonDateParts();


    const english =
      data.translations.find(
        item =>
          item.language_code === "en"
      ) ||
      data.translations[0];


    document.title =
      `${
        english?.display_name ||
        data.place.official_name
      } | PTLife`;


    document
      .getElementById("place-type")
      .textContent =
        data.place.place_type;


    document
      .getElementById("place-name")
      .textContent =
        english?.display_name ||
        data.place.official_name;


    document
      .getElementById("place-location")
      .textContent =
        [
          data.place.neighborhood,
          data.place.city
        ]
        .filter(Boolean)
        .join(", ");


    document
      .getElementById("place-description")
      .textContent =
        english?.short_description || "";


    renderTodayStatus(
      data,
      today
    );

    renderHours(data);

    renderAdmission(
      data,
      today
    );

    renderExceptions(data);


    document
      .getElementById("address")
      .textContent =
        [
          data.place.address,
          data.place.postal_code,
          data.place.city
        ]
        .filter(Boolean)
        .join(", ");


    const officialWebsite =
      document.getElementById(
        "official-website"
      );

    officialWebsite.href =
      data.place.official_website;


    document
      .getElementById("loading")
      .hidden = true;

    document
      .getElementById("place-content")
      .hidden = false;


  } catch (error) {

    document
      .getElementById("loading")
      .hidden = true;

    document
      .getElementById("error")
      .hidden = false;

  }
}


loadPlace();

</script>

</body>
</html>
